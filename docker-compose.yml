version: '3.8'

services:
  # -------------------------------------------------------------
  # INFRASTRUCTURE: MySQL 8.0 (Isolated Schemas per Service)
  # -------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: vibepass-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - vibepass-network

  # -------------------------------------------------------------
  # INFRASTRUCTURE: Redis 7.x (Cache, Socket Adapter & Event Bus)
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: vibepass-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - vibepass-network

  # -------------------------------------------------------------
  # INGRESS & REVERSE PROXY: API Gateway
  # -------------------------------------------------------------
  gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE_ENTRY: apps/gateway/src/main.ts
    container_name: vibepass-gateway
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      NODE_ENV: production
      AUTH_SERVICE_URL: http://auth-service:4001
      MATCHING_SERVICE_URL: http://matching-service:4002
      REALTIME_SERVICE_URL: http://realtime-service:4003
      SOCIAL_SERVICE_URL: http://social-service:4004
      SAFETY_SERVICE_URL: http://safety-service:4005
      FRONTEND_URL: http://localhost:3000,http://frontend:3000
    depends_on:
      - auth-service
      - matching-service
      - realtime-service
      - social-service
      - safety-service
    networks:
      - vibepass-network

  # -------------------------------------------------------------
  # CORE MICROSERVICE: Auth & Identity Service
  # -------------------------------------------------------------
  auth-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE_ENTRY: apps/auth-service/src/main.ts
    container_name: vibepass-auth-service
    restart: unless-stopped
    ports:
      - "4001:4001"
    environment:
      AUTH_SERVICE_PORT: 4001
      DATABASE_URL: mysql://root:root@mysql:3306/vibepass_auth
      REDIS_URL: redis://redis:6379
      JWT_SECRET: super_secret_jwt_microservices
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vibepass-network

  # -------------------------------------------------------------
  # CORE MICROSERVICE: Matching & Discovery Service
  # -------------------------------------------------------------
  matching-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE_ENTRY: apps/matching-service/src/main.ts
    container_name: vibepass-matching-service
    restart: unless-stopped
    ports:
      - "4002:4002"
    environment:
      MATCHING_SERVICE_PORT: 4002
      DATABASE_URL: mysql://root:root@mysql:3306/vibepass_matching
      REDIS_URL: redis://redis:6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vibepass-network

  # -------------------------------------------------------------
  # CORE MICROSERVICE: Realtime Chat & WebRTC Voice Service
  # -------------------------------------------------------------
  realtime-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE_ENTRY: apps/realtime-service/src/main.ts
    container_name: vibepass-realtime-service
    restart: unless-stopped
    ports:
      - "4003:4003"
    environment:
      REALTIME_SERVICE_PORT: 4003
      DATABASE_URL: mysql://root:root@mysql:3306/vibepass_social
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - vibepass-network

  # -------------------------------------------------------------
  # CORE MICROSERVICE: Social & Feed Service
  # -------------------------------------------------------------
  social-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE_ENTRY: apps/social-service/src/main.ts
    container_name: vibepass-social-service
    restart: unless-stopped
    ports:
      - "4004:4004"
    environment:
      SOCIAL_SERVICE_PORT: 4004
      DATABASE_URL: mysql://root:root@mysql:3306/vibepass_social
      REDIS_URL: redis://redis:6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vibepass-network

  # -------------------------------------------------------------
  # CORE MICROSERVICE: Safety & Moderation Service
  # -------------------------------------------------------------
  safety-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE_ENTRY: apps/safety-service/src/main.ts
    container_name: vibepass-safety-service
    restart: unless-stopped
    ports:
      - "4005:4005"
    environment:
      SAFETY_SERVICE_PORT: 4005
      DATABASE_URL: mysql://root:root@mysql:3306/vibepass_safety
      REDIS_URL: redis://redis:6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vibepass-network

  # -------------------------------------------------------------
  # CLIENT: Next.js 14 Frontend
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vibepass-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3003
      NEXT_PUBLIC_WS_URL: ws://localhost:3003
    depends_on:
      - gateway
    networks:
      - vibepass-network

networks:
  vibepass-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:

